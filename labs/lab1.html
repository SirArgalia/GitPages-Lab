<!DOCTYPE html>
<html lang="uk">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Лабораторна робота №1</title>
    <link rel="stylesheet" href="../css/style.css">
</head>
<body>

    <!-- Шапка з обгорткою .container -->
    <header>
        <div class="container">
            <h1>Шнайдер Даниїл</h1>
            <nav>
                <ul>
                    <li><a href="../index.html">Головна</a></li>
                    <li><a href="../html/about me.html">Про мене</a></li>
                    <li><a href="../practicals/practicals.html">Практичні роботи</a></li>
                    <li><a href="labs.html" class="active">Лабораторні заняття</a></li>
                </ul>
            </nav>
        </div>
    </header>

    <!-- Основний контент всередині .container -->
    <main class="container">
        <!-- Посилання "Назад" розміщуємо всередині основного контейнера -->
        <a href="labs.html" class="back-link">&larr; Повернутися до списку лабораторних</a>

        <!-- Картка з формою -->
        <div class="form-card">
            <h2>Реєстрація користувача</h2>
            <form>
                <div class="form-group">
                    <label for="fname">Ім'я *</label>
                    <input type="text" id="fname" placeholder="Введіть ім'я" required>
                </div>

                <div class="form-group">
                    <label for="lname">Прізвище *</label>
                    <input type="text" id="lname" placeholder="Введіть прізвище" required>
                </div>

                <div class="form-group">
                    <label for="email">Електронна пошта *</label>
                    <input type="email" id="email" placeholder="example@mail.com" required>
                </div>

                <div class="form-group">
                    <label for="password">Пароль *</label>
                    <input type="password" id="password" placeholder="Введіть пароль" required>
                </div>

                <div class="form-group">
                    <label for="confirm-password">Підтвердження паролю *</label>
                    <input type="password" id="confirm-password" placeholder="Повторіть пароль" required>
                </div>

                <div class="form-group">
                    <label for="dob">Дата народження</label>
                    <input type="date" id="dob">
                </div>

                <div class="form-group">
                    <label for="gender">Стать</label>
                    <select id="gender">
                        <option value="">-- Оберіть стать --</option>
                        <option value="male">Чоловіча</option>
                        <option value="female">Жіноча</option>
                    </select>
                </div>

                <input type="submit" value="Зареєструватися">
            </form>
        </div>
    </main>

    <footer>
        <p>&copy; 2026 Шнайдер Даниїл. Всі права захищено.</p>
    </footer>

</body>
</html>
