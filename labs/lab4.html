<!DOCTYPE html>
<html lang="uk">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Лабораторна робота №4 — Weekly Plan</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&family=Oswald:wght@500;600&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="../css/lab4.css">
</head>
<body>

    <div class="page-wrapper">
        <nav class="top-nav">
            <a href="labs.html" class="back-link">← До лабораторних занять</a>
            <span>Лабораторна робота №4 — Планер (CSS Grid)</span>
        </nav>

        <main class="planner-sheet">

            <header class="planner-header">
                <h1 class="planner-title">WEEKLY PLAN</h1>

                <label class="header-field">
                    <span>WEEK OF</span>
                    <input type="text" aria-label="Week of">
                </label>

                <label class="header-field">
                    <span>HEALTHY HABIT</span>
                    <input type="text" aria-label="Healthy habit">
                </label>

                <div class="header-checks">
                    <label class="check-label right-check">
                        <span>ROCKED IT</span>
                        <input type="checkbox">
                    </label>
                    <label class="check-label right-check">
                        <span>ROOM FOR IMPROVEMENT</span>
                        <input type="checkbox">
                    </label>
                </div>
            </header>

            <aside class="todo-column">
                <span class="todo-badge">TO DO</span>

                <section class="todo-group">
                    <h2>TOP 3 GOALS</h2>
                    <div class="todo-row"><input type="checkbox"><input type="text"></div>
                    <div class="todo-row"><input type="checkbox"><input type="text"></div>
                    <div class="todo-row"><input type="checkbox"><input type="text"></div>
                </section>

                <section class="todo-group">
                    <h2>EVERYTHING ELSE</h2>
                    <div class="todo-row"><input type="checkbox"><input type="text"></div>
                    <div class="todo-row"><input type="checkbox"><input type="text"></div>
                    <div class="todo-row"><input type="checkbox"><input type="text"></div>
                    <div class="todo-row"><input type="checkbox"><input type="text"></div>
                    <div class="todo-row"><input type="checkbox"><input type="text"></div>
                    <div class="todo-row"><input type="checkbox"><input type="text"></div>
                    <div class="todo-row"><input type="checkbox"><input type="text"></div>
                    <div class="todo-row"><input type="checkbox"><input type="text"></div>
                    <div class="todo-row"><input type="checkbox"><input type="text"></div>
                    <div class="todo-row"><input type="checkbox"><input type="text"></div>
                    <div class="todo-row"><input type="checkbox"><input type="text"></div>
                </section>

                <section class="todo-group">
                    <h2>NEXT WEEK</h2>
                    <div class="todo-row"><input type="checkbox"><input type="text"></div>
                    <div class="todo-row"><input type="checkbox"><input type="text"></div>
                    <div class="todo-row"><input type="checkbox"><input type="text"></div>
                </section>
            </aside>

            

            <section class="day-box day-mon corner-mark">
                <div class="day-header">
                    <h2>MONDAY</h2>
                    <input type="checkbox" aria-label="Monday completed">
                </div>
                <textarea class="day-notes" aria-label="Monday notes"></textarea>
            </section>


            <section class="day-box day-tue corner-mark">
                <div class="day-header">
                    <h2>TUESDAY</h2>
                    <input type="checkbox" aria-label="Tuesday completed">
                </div>
                <textarea class="day-notes" aria-label="Tuesday notes"></textarea>
            </section>


            <section class="day-box day-wed corner-mark">
                <div class="day-header">
                    <h2>WEDNESDAY</h2>
                    <input type="checkbox" aria-label="Wednesday completed">
                </div>
                <textarea class="day-notes" aria-label="Wednesday notes"></textarea>
            </section>


            <section class="day-box day-thu corner-mark">
                <div class="day-header">
                    <h2>THURSDAY</h2>
                    <input type="checkbox" aria-label="Thursday completed">
                </div>
                <textarea class="day-notes" aria-label="Thursday notes"></textarea>
            </section>


            <section class="day-box day-fri corner-mark">
                <div class="day-header">
                    <h2>FRIDAY</h2>
                    <input type="checkbox" aria-label="Friday completed">
                </div>
                <textarea class="day-notes" aria-label="Friday notes"></textarea>
            </section>


            <section class="day-box day-sat corner-mark">
                <div class="day-header">
                    <h2>SATURDAY</h2>
                    <input type="checkbox" aria-label="Saturday completed">
                </div>
                <textarea class="day-notes" aria-label="Saturday notes"></textarea>
            </section>


            <section class="day-box day-sun">
                <div class="day-header">
                    <h2>SUNDAY</h2>
                    <input type="checkbox" aria-label="Sunday completed">
                </div>
                <textarea class="day-notes" aria-label="Sunday notes"></textarea>
            </section>

        </main>
    </div>

</body>
</html>
