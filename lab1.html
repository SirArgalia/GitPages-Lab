<!DOCTYPE html>
<html lang="uk">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Лабораторна робота №1 — Реєстрація</title>
    <style>
        :root {
            --bg-color: #0f172a;
            --card-bg: #1e293b;
            --accent-color: #38bdf8;
            --text-main: #f8fafc;
            --text-muted: #94a3b8;
            --border-color: #334155;
        }

        body {
            font-family: 'Inter', system-ui, -apple-system, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-main);
            margin: 0;
            padding: 0;
            display: flex;
            flex-direction: column;
            min-height: 100vh;
        }

        .container {
            width: 90%;
            max-width: 600px;
            margin: 0 auto;
            padding: 20px;
        }

        header {
            background-color: rgba(30, 41, 59, 0.8);
            border-bottom: 1px solid var(--border-color);
            padding: 15px 0;
        }

        header .nav-container {
            width: 90%;
            max-width: 1200px;
            margin: 0 auto;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        nav ul {
            list-style: none;
            display: flex;
            gap: 10px;
            margin: 0;
            padding: 0;
        }

        nav a {
            color: var(--text-muted);
            text-decoration: none;
            padding: 8px 16px;
            border-radius: 8px;
        }

        nav a:hover, nav a.active {
            color: var(--text-main);
            background-color: var(--border-color);
        }

        .form-card {
            background-color: var(--card-bg);
            border: 1px solid var(--border-color);
            border-radius: 12px;
            padding: 30px;
            margin-top: 30px;
            box-shadow: 0 10px 25px rgba(0,0,0,0.3);
        }

        h2 {
            margin-top: 0;
            color: var(--accent-color);
            text-align: center;
            margin-bottom: 25px;
        }

        .form-group {
            margin-bottom: 18px;
            display: flex;
            flex-direction: column;
            gap: 6px;
        }

        label {
            font-weight: 500;
            font-size: 0.95rem;
        }

        input[type="text"],
        input[type="email"],
        input[type="password"],
        input[type="date"],
        select {
            width: 100%;
            padding: 10px 12px;
            border-radius: 6px;
            border: 1px solid var(--border-color);
            background-color: var(--bg-color);
            color: var(--text-main);
            box-sizing: border-box;
            font-size: 1rem;
        }

        input:focus, select:focus {
            outline: none;
            border-color: var(--accent-color);
        }

        input[type="submit"] {
            background-color: var(--accent-color);
            color: #0f172a;
            border: none;
            padding: 12px;
            font-weight: bold;
            font-size: 1rem;
            border-radius: 6px;
            cursor: pointer;
            width: 100%;
            margin-top: 10px;
            transition: background-color 0.2s;
        }

        input[type="submit"]:hover {
            background-color: #0284c7;
            color: #ffffff;
        }

        .back-link {
            display: inline-block;
            margin-bottom: 15px;
            color: var(--accent-color);
            text-decoration: none;
        }
    </style>
</head>
<body>

<header>
    <div class="nav-container">
        <h1 style="font-size: 1.2rem; color: var(--accent-color);">Шнайдер Даниїл</h1>
        <nav>
            <ul>
                <li><a href="index.html">Головна</a></li>
                <li><a href="about-me.html">Про мене</a></li>
                <li><a href="practicals.html">Практичні роботи</a></li>
                <li><a href="labs.html" class="active">Лабораторні заняття</a></li>
            </ul>
        </nav>
    </div>
</header>

<main class="container">
    <a href="labs.html" class="back-link">← Повернутися до списку лабораторних</a>

    <div class="form-card">
        <h2>Реєстрація користувача</h2>
        
   
        <form action="https://webhook.site/https://webhook.site/ee2a2c82-438c-47fd-a446-6cb418c6906e" method="POST">
            
            <div class="form-group">
                <label for="first_name">Ім'я *</label>
                <input type="text" id="first_name" name="first_name" required placeholder="Введіть ім'я">
            </div>

            <div class="form-group">
                <label for="last_name">Прізвище *</label>
                <input type="text" id="last_name" name="last_name" required placeholder="Введіть прізвище">
            </div>

            <div class="form-group">
                <label for="email">Електронна пошта *</label>
                <input type="email" id="email" name="email" required placeholder="example@mail.com">
            </div>

            <div class="form-group">
                <label for="password">Пароль *</label>
                <input type="password" id="password" name="password" required placeholder="Введіть пароль">
            </div>

            <div class="form-group">
                <label for="confirm_password">Підтвердження паролю *</label>
                <input type="password" id="confirm_password" name="confirm_password" required placeholder="Повторіть пароль">
            </div>

            <div class="form-group">
                <label for="birthdate">Дата народження</label>
                <input type="date" id="birthdate" name="birthdate">
            </div>

            <div class="form-group">
                <label for="gender">Стать</label>
                <select id="gender" name="gender">
                    <option value="">-- Оберіть стать --</option>
                    <option value="male">Чоловіча</option>
                    <option value="female">Жіноча</option>
                    <option value="other">Інша</option>
                </select>
            </div>

            <input type="submit" value="Зареєструватися">
        </form>
    </div>
</main>

</body>
</html>
